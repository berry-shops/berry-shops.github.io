<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berry Shops</title>
<style>
  :root{
    --bg:#f4f8f8; --surface:#ffffff;
    --ink:#182223; --muted:#586468; --faint:#8b979b;
    --line:#e4ebec; --line-strong:#d0dadb;
    --accent:#0e93b8; --accent-deep:#0a7495; --accent-soft:#e6f4f8;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1415; --surface:#141d1f; --ink:#e7eff0; --muted:#98a6aa; --faint:#6c7a7e;
      --line:#233032; --line-strong:#314245; --accent:#37c1e4; --accent-deep:#79d7f1; --accent-soft:#123039;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1415; --surface:#141d1f; --ink:#e7eff0; --muted:#98a6aa; --faint:#6c7a7e;
    --line:#233032; --line-strong:#314245; --accent:#37c1e4; --accent-deep:#79d7f1; --accent-soft:#123039;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{max-width:520px; width:100%; text-align:center}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--accent-deep); font-weight:600; margin:0 0 14px}
  h1{font-size:clamp(32px,7vw,48px); letter-spacing:-.02em; margin:0 0 12px; font-weight:800}
  p.lede{color:var(--muted); font-size:17px; line-height:1.6; margin:0 auto 30px; max-width:40ch}
  .links{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
  .links a{text-decoration:none; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:14px 22px; color:var(--accent-deep); font-weight:700;
    transition:border-color .18s ease}
  .links a:hover{border-color:var(--accent)}
  footer{margin-top:38px; color:var(--faint); font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Berry Shops</p>
    <h1>Berry Shops</h1>
    <p class="lede">Your personal wallet for gift cards, coupons, and receipts — private by design, stored on your device and your own iCloud.</p>
    <div class="links">
      <a href="support.html">Support</a>
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
    <footer>© 2026 Berry Shops LLC · California, USA</footer>
  </div>
</body>
</html>
